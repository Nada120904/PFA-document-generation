[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docling-service"
version = "0.1.0"
description = "Independent Docling parsing service for the RAG system"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "docling>=2.0.0",
  "docling-ocr-onnxtr[cpu]",
  "easyocr>=1.7.2",
  "rapidocr>=3.7.0",
  "onnxruntime>=1.18.0",
  "tesserocr>=2.6.2",
  "anyio>=4.0",
]
