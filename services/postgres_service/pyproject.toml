[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postgres-service"
version = "0.1.0"
description = "Independent PostgreSQL data service for the RAG system"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
]
